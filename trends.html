<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#fe502d"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Trendslator"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <link rel="manifest" href="assets/img/favicon/site.webmanifest"/>
    <link rel="icon" href="assets/img/favicon/favicon.ico" sizes="any"/>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png"/>
    <link rel="apple-touch-icon" href="assets/img/favicon/apple-touch-icon.png"/>
    <meta name="description" content="Trendslator — flux des tendances"/>
    <meta name="author" content="Trendslator"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gasoek+One&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" href="assets/css/custom.css"/>

    <title>Trends — Trendslator</title>
</head>

<body>
<div class="app">
    <header class="page-head page-head--simple">
        <h1 class="page-head__title">Trends</h1>
        <div class="trends-tabs" role="tablist" aria-label="Filtre des tendances">
            <button class="trends-tab is-active" id="trends-tab-new" type="button" role="tab" aria-selected="true" aria-controls="trends-panel-new" data-trends-tab="new">Nouvelles trends</button>
            <button class="trends-tab" id="trends-tab-old" type="button" role="tab" aria-selected="false" aria-controls="trends-panel-old" data-trends-tab="old">Anciennes</button>
        </div>
    </header>

    <main class="content content--trends" id="trends-main">
        <section id="trends-panel-new" role="tabpanel" aria-labelledby="trends-tab-new">
            <p class="trends-loading" id="trends-loading">Chargement des tendances&hellip;</p>
            <div id="trends-cards-root" class="trends-cards-root" hidden></div>
        </section>
        <section id="trends-panel-old" role="tabpanel" aria-labelledby="trends-tab-old" hidden>
            <p class="trends-loading" id="old-trends-loading">Chargement des anciennes trends&hellip;</p>
            <div id="old-trends-root" class="old-trends-root" hidden></div>
        </section>
    </main>

    <div class="app-dock">
        <nav class="bottom-nav" aria-label="Navigation principale">
            <a href="index.html" class="bottom-nav__item">
                <img class="bottom-nav__icon bottom-nav__icon--home" src="assets/img/icon/home_icon.svg" alt="" width="24" height="24" decoding="async"/>
                <span>Accueil</span>
            </a>
            <a href="trends.html" class="bottom-nav__item bottom-nav__item--active" aria-current="page">
                <img class="bottom-nav__icon bottom-nav__icon--trends" src="assets/img/icon/card_icon.svg" alt="" width="28" height="21" decoding="async"/>
                <span>Trends</span>
            </a>
            <a href="glossaire.html" class="bottom-nav__item">
                <img class="bottom-nav__icon bottom-nav__icon--glossaire" src="assets/img/icon/glossaire_icon.svg" alt="" width="24" height="23" decoding="async"/>
                <span>Glossaire</span>
            </a>
            <a href="rechercher.html" class="bottom-nav__item">
                <img class="bottom-nav__icon bottom-nav__icon--search" src="assets/img/icon/search_icon.svg" alt="" width="22" height="22" decoding="async"/>
                <span>Rechercher</span>
            </a>
        </nav>
    </div>

    <!-- Feuille de détail (superposition) -->
    <div class="trend-sheet" id="trend-sheet" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Détail de la tendance">
        <div class="trend-sheet__backdrop" tabindex="-1"></div>
        <div class="trend-sheet__panel" id="trend-sheet-panel">
            <div class="trend-sheet__handle-wrap" id="trend-sheet-handle" aria-hidden="true">
                <div class="trend-sheet__handle"></div>
            </div>
            <div class="trend-sheet__scroller" id="trend-sheet-scroller">
                <div
                    class="trend-sheet__content content--trend-detail trend-sheet__detail"
                    id="trend-sheet-dynamic"
                    data-trend-id=""
                    hidden
                ></div>
            </div>
        </div>
    </div>
</div>

<script src="assets/js/trends-data.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>

</html>
