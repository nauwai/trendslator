<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#fe502d"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Trendslator"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <link rel="manifest" href="assets/img/favicon/site.webmanifest"/>
    <link rel="icon" href="assets/img/favicon/favicon.ico" sizes="any"/>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png"/>
    <link rel="apple-touch-icon" href="assets/img/favicon/apple-touch-icon.png"/>
    <meta name="description" content="Rechercher — Trendslator"/>
    <meta name="author" content="Trendslator"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gasoek+One&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" href="assets/css/custom.css"/>

    <title>Rechercher — Trendslator</title>
</head>

<body>
<div class="app app--search">
    <main class="content content--search">
        <div class="search-toolbar">
            <label class="glossary-search search-toolbar__field">
                <span class="glossary-search__icon-wrap" aria-hidden="true">
                    <svg class="glossary-search__icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <circle cx="7.5" cy="7.5" r="5" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M11.5 11.5L16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </span>
                <input type="search" class="glossary-search__input" id="search-page-input" placeholder="Rechercher" autocomplete="off" enterkeyhint="search"/>
            </label>
            <button type="button" class="glossary-cancel" id="search-page-submit">Rechercher</button>
        </div>

        <div class="search-body" id="search-default-view">
            <section class="search-block" aria-labelledby="search-trends-heading">
                <div class="search-block__head">
                    <h2 id="search-trends-heading" class="search-block__title">Les trends du moment</h2>
                    <button type="button" class="search-block__action" id="search-refresh-btn">Actualiser</button>
                </div>
                <ul class="search-list" id="search-trends-list"></ul>
            </section>
        </div>

        <div id="search-results-view" hidden>
            <div id="search-global-results"></div>
        </div>
    </main>

    <div class="app-dock">
        <nav class="bottom-nav" aria-label="Navigation principale">
            <a href="index.html" class="bottom-nav__item">
                <img class="bottom-nav__icon bottom-nav__icon--home" src="assets/img/icon/home_icon.svg" alt="" width="24" height="24" decoding="async"/>
                <span>Accueil</span>
            </a>
            <a href="trends.html" class="bottom-nav__item">
                <img class="bottom-nav__icon bottom-nav__icon--trends" src="assets/img/icon/card_icon.svg" alt="" width="28" height="21" decoding="async"/>
                <span>Trends</span>
            </a>
            <a href="glossaire.html" class="bottom-nav__item">
                <img class="bottom-nav__icon bottom-nav__icon--glossaire" src="assets/img/icon/glossaire_icon.svg" alt="" width="24" height="23" decoding="async"/>
                <span>Glossaire</span>
            </a>
            <a href="rechercher.html" class="bottom-nav__item bottom-nav__item--active" aria-current="page">
                <img class="bottom-nav__icon bottom-nav__icon--search" src="assets/img/icon/search_icon.svg" alt="" width="22" height="22" decoding="async"/>
                <span>Rechercher</span>
            </a>
        </nav>
    </div>
</div>

<script src="assets/js/trends-data.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>

</html>
