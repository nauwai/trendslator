<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#fe502d"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Trendslator"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <link rel="manifest" href="assets/img/favicon/site.webmanifest"/>
    <link rel="icon" href="assets/img/favicon/favicon.ico" sizes="any"/>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png"/>
    <link rel="apple-touch-icon" href="assets/img/favicon/apple-touch-icon.png"/>
    <meta name="description" content="Trendslator — tendances et langage du web francophone"/>
    <meta name="author" content="Trendslator"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gasoek+One&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" href="assets/css/custom.css"/>

    <title>Accueil — Trendslator</title>
</head>

<body>
<div class="app">
    <header class="page-head">
        <div class="page-head__title-row">
            <h1 class="page-head__title">Accueil</h1>
            <a href="a-propos.html" class="page-head__about-link" aria-label="À propos du projet Trendslator">
                <img class="page-head__about-icon" src="assets/img/icon/info_icon.svg" alt="" width="22" height="22" decoding="async"/>
            </a>
        </div>
        <div class="page-head__row">
            <span class="page-head__section-title">Top Tendance</span>
            <span class="pill pill--purple">À la une</span>
        </div>
    </header>

    <main class="content">
        <article class="featured" id="home-featured-root">
            <a class="featured__link" id="home-featured-link" href="trends.html">
                <div class="featured__media neo-shadow neo-shadow--purple">
                    <img id="home-featured-img" src="assets/img/thumbnail/skibiditentafruit.png" alt="" width="800" height="450" loading="eager"/>
                </div>
                <h2 class="featured__title" id="home-featured-title">Chargement de la tendance&hellip;</h2>
                <p class="featured__desc" id="home-featured-desc"></p>
            </a>
        </article>

        <section class="word-of-day" aria-labelledby="word-of-day-heading">
            <h2 id="word-of-day-heading" class="word-of-day__heading">
                Mot du jour <span class="word-of-day__highlight" id="word-of-day-highlight">&hellip;</span>
            </h2>
            <div class="word-of-day__card">
                <p class="word-of-day__definition" id="word-of-day-definition"></p>
            </div>
            <div class="word-of-day__actions">
                <button type="button" class="btn-brutal">Voir le Glossaire</button>
            </div>
        </section>

        <section class="tt-quiz-module">
            <div class="tt-quiz-title">Es-tu à la page ?</div>
            <div class="tt-quiz-stack">
                <div class="tt-quiz-card">
                    <div class="tt-quiz-header">
                        <div class="tt-quiz-heading">Quiz Express</div>
                    </div>

                    <div class="tt-quiz-question" id="tt-quiz-question">
                        Que signifie l'expression "C'est ciao" ?
                    </div>

                    <div class="tt-quiz-options" id="tt-quiz-options">
                        <button class="tt-quiz-btn" data-correct="false">A. C'est l'heure de manger</button>
                        <button class="tt-quiz-btn" data-correct="true">B. C'est terminé / c'est raté</button>
                        <button class="tt-quiz-btn" data-correct="false">C. C'est dommage</button>
                    </div>

                    <div class="tt-quiz-feedback" id="tt-quiz-feedback" aria-live="polite"></div>

                    <button class="tt-quiz-next" id="tt-quiz-next" type="button" hidden>Question suivante</button>
                </div>

                <div class="tt-quiz-accent"></div>
            </div>
        </section>
    </main>

    <div class="app-dock">
        <nav class="bottom-nav" aria-label="Navigation principale">
            <a href="index.html" class="bottom-nav__item bottom-nav__item--active" aria-current="page">
                <img class="bottom-nav__icon bottom-nav__icon--home" src="assets/img/icon/home_icon.svg" alt="" width="24" height="24" decoding="async"/>
                <span>Accueil</span>
            </a>
            <a href="trends.html" class="bottom-nav__item">
                <img class="bottom-nav__icon bottom-nav__icon--trends" src="assets/img/icon/card_icon.svg" alt="" width="28" height="21" decoding="async"/>
                <span>Trends</span>
            </a>
            <a href="glossaire.html" class="bottom-nav__item">
                <img class="bottom-nav__icon bottom-nav__icon--glossaire" src="assets/img/icon/glossaire_icon.svg" alt="" width="24" height="23" decoding="async"/>
                <span>Glossaire</span>
            </a>
            <a href="rechercher.html" class="bottom-nav__item">
                <img class="bottom-nav__icon bottom-nav__icon--search" src="assets/img/icon/search_icon.svg" alt="" width="22" height="22" decoding="async"/>
                <span>Rechercher</span>
            </a>
        </nav>
    </div>
</div>

<script src="assets/js/trends-data.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>

</html>
